  release-lane-desktop-packaging:
    name: Release Lane / Desktop and Local Packaging Proof
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install package
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Check local Docker prerequisite
        id: docker
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Control Center dependencies
        if: steps.docker.outputs.available == 'true'
        working-directory: apps/control-center
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.docker.outputs.available == 'true'
        working-directory: apps/control-center
        run: npx playwright install --with-deps chromium

      - name: Run desktop packaging release lane
        shell: bash
        run: |
          set +e
          set -u
          log_dir="${RUNNER_TEMP:-/tmp}/uaa-release-lanes"
          mkdir -p "$log_dir"
          status=0
          {
            echo "## Release Lane / Desktop and Local Packaging Proof"
            echo ""
            echo "- Lane id: desktop-packaging"
            echo "- Report mode: safe-summary-only"
            echo "- Raw command output: captured locally and not uploaded"
            echo "- Prerequisite posture: local runtime and browser prerequisite failures report by command ref only"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          run_lane_command() {
            local command_ref="$1"
            shift
            local log_file="$log_dir/${command_ref//[:.]/_}.log"
            echo "Running ${command_ref}; command output is captured for safe-summary-only reporting."
            "$@" > "$log_file" 2>&1
            local exit_code=$?
            if [ "$exit_code" -eq 0 ]; then
              echo "- ${command_ref}: pass" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ${command_ref}: fail" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
          }

          if [ "${{ steps.docker.outputs.available }}" = "true" ]; then
            run_lane_command "command:desktop-packaging.proof" env PYTHONPATH=src .venv/bin/python scripts/run_local_runtime_packaging_proof.py --timeout-seconds 240
          else
            echo "- command:desktop-packaging.proof: skipped (reason-ref:self-hosted-runner-docker-unavailable)" >> "$GITHUB_STEP_SUMMARY"
          fi
          run_lane_command "command:desktop-packaging.contract" env PYTHONPATH=src .venv/bin/python scripts/verify_local_runtime_packaging_proof.py
          exit "$status"

  foundation-gate-report:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]
    needs:
      - lint
      - pytest
      - static-verification
      - release-lane-docs
      - release-lane-openapi
      - release-lane-api-safety
      - release-lane-security-redaction
      - release-lane-product-truth
      - release-lane-local-model-e2e
      - release-lane-durability
      - release-lane-frontend
      - release-lane-visual-regression
      - release-lane-desktop-packaging
      - release-lane-performance

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install package
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run Foundation Gate report
        shell: bash
        run: |
          {
            echo "## Foundation Gate / CI Parallel"
            echo ""
            echo "- Report mode: safe-summary-only"
            echo "- Command mode: ci-parallel"
            echo "- Lane execution evidence: represented by required CI job dependencies"
            echo "- Raw lane output: not collected or uploaded by this job"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"
          .venv/bin/python scripts/run_foundation_gate.py --command-mode ci-parallel --no-write-latest

  control-center-frontend:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]

    defaults:
      run:
        working-directory: apps/control-center

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck --if-present

      - name: Lint frontend
        run: npm run lint --if-present

      - name: Test frontend
        run: npm run test --if-present -- --run

      - name: Build frontend
        run: npm run build --if-present
