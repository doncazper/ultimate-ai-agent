        working-directory: apps/control-center
        run: npx playwright install --with-deps chromium

      - name: Run desktop packaging release lane
        env:
          DOCKER_AVAILABLE: ${{ steps.docker.outputs.available }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          docker_posture="unavailable"
          if [ "$DOCKER_AVAILABLE" = "true" ]; then
            docker_posture="available"
          fi
          .venv/bin/python scripts/verification/run_ci_lane.py \
