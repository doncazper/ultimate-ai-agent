name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: uaa-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PATH: /opt/homebrew/opt/python@3.12/libexec/bin:/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

# Self-hosted jobs are limited to branches in this private repository. Fork pull
# requests must never schedule code on the local Mac.

jobs:
  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install package
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: .venv/bin/python -m ruff check .

      - name: Verify self-hosted macOS CI contract
        run: .venv/bin/python scripts/verify_self_hosted_macos_ci.py

  pytest-shards:
    name: pytest / shard ${{ matrix.shard }}
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install package
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run pytest shard
        run: |
          .venv/bin/python scripts/verification/run_pytest_shards.py \
            --shards 8 \
            --shard-index ${{ matrix.shard }} \
            --timings-json scripts/verification/pytest_file_timing_seed.json \
            --basetemp "${RUNNER_TEMP}/uaa_pytest_shards" \
            --stretch-goal-seconds 180 \
            --target-seconds 240 \
            --hard-timeout-seconds 300 \
            --performance-report "${RUNNER_TEMP}/uaa_pytest_performance_report.json" \
            --quiet \
            --safe-summary

  pytest:
    name: pytest
    needs:
      - pytest-shards
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]

    steps:
      - name: Confirm complete pytest shard matrix
        env:
          PYTEST_SHARDS_RESULT: ${{ needs.pytest-shards.result }}
        run: |
          if [ "$PYTEST_SHARDS_RESULT" != "success" ]; then
            echo "Pytest shard matrix did not complete successfully."
            exit 1
          fi
          echo "All eight isolated pytest shards passed."

  static-verification:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install package
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run static verification
        run: .venv/bin/python scripts/verify_all.py --skip-ruff --skip-pytest --timings-json /tmp/uaa_static_verification_timings.json

  release-lane-docs:
    name: Release Lane / Documentation Integrity
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false

      - name: Install package
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run docs release lane
        shell: bash
        run: |
          set -u
          status=0
          log_dir="${RUNNER_TEMP:-/tmp}/uaa-release-lanes"
          mkdir -p "$log_dir"
          {
            echo "## Release Lane / Documentation Integrity"
            echo ""
            echo "- Lane id: docs"
            echo "- Report mode: safe-summary-only"
            echo "- Raw command output: captured locally and not uploaded"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          run_lane_command() {
            local command_ref="$1"
            shift
            local log_file="$log_dir/${command_ref//[:.]/_}.log"
            echo "Running ${command_ref}; command output is captured for safe-summary-only reporting."
            "$@" > "$log_file" 2>&1
            local exit_code=$?
            if [ "$exit_code" -eq 0 ]; then
              echo "- ${command_ref}: pass" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ${command_ref}: fail" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
          }

          run_lane_command "command:docs.integrity" .venv/bin/python scripts/verify_documentation_integrity.py
          exit "$status"

