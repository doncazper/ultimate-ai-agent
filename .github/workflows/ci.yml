name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run Ruff
        run: .venv/bin/python -m ruff check .

  pytest:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run pytest
        run: .venv/bin/python -m pytest -q --durations=50 --durations-min=0.05

  static-verification:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run static verification
        run: .venv/bin/python scripts/verify_all.py --skip-ruff --skip-pytest --timings-json /tmp/uaa_static_verification_timings.json

  release-lane-docs:
    name: Release Lane / Documentation Integrity
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml

      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run docs release lane
        shell: bash
        run: |
          set -u
          status=0
          log_dir="${RUNNER_TEMP:-/tmp}/uaa-release-lanes"
          mkdir -p "$log_dir"
          {
            echo "## Release Lane / Documentation Integrity"
            echo ""
            echo "- Lane id: docs"
            echo "- Report mode: safe-summary-only"
            echo "- Raw command output: captured locally and not uploaded"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          run_lane_command() {
            local command_ref="$1"
            shift
            local log_file="$log_dir/${command_ref//[:.]/_}.log"
            echo "Running ${command_ref}; command output is captured for safe-summary-only reporting."
            "$@" > "$log_file" 2>&1
            local exit_code=$?
            if [ "$exit_code" -eq 0 ]; then
              echo "- ${command_ref}: pass" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "- ${command_ref}: fail" >> "$GITHUB_STEP_SUMMARY"
              status=1
            fi
          }

          run_lane_command "command:docs.integrity" .venv/bin/python scripts/verify_documentation_integrity.py
          exit "$status"

