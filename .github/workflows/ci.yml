name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: uaa-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PATH: /opt/homebrew/opt/python@3.12/libexec/bin:/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
  UAA_CI_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

defaults:
  run:
    shell: /usr/sbin/taskpolicy -c utility /bin/bash --noprofile --norc -e -o pipefail {0}

# Self-hosted jobs are limited to branches in this private repository. Fork pull
# requests must never schedule code on the local Mac.

jobs:
  manifest-attestation:
    name: manifest-attestation
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.UAA_CI_EXACT_SHA }}

      - name: Install package
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run canonical manifest attestation
        run: |
          .venv/bin/python scripts/verification/run_ci_lane.py \
            --lane ci-manifest-attestation \
            --sha "$UAA_CI_EXACT_SHA" \
            --temp-root "$RUNNER_TEMP" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]
    needs:
      - manifest-attestation

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.UAA_CI_EXACT_SHA }}

      - name: Install package
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run canonical lint lane
        run: |
          .venv/bin/python scripts/verification/run_ci_lane.py \
            --lane ci-lint \
            --sha "$UAA_CI_EXACT_SHA" \
            --temp-root "$RUNNER_TEMP" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  pytest-shards:
    name: pytest / sharded suite
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]
    needs:
      - lint
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.UAA_CI_EXACT_SHA }}

      - name: Install package
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run pytest shard
        run: |
          shard_runner_pid=""
          # shellcheck disable=SC2329
          terminate_shard_runner() {
            trap - EXIT
            trap '' INT TERM HUP
            if [ -n "$shard_runner_pid" ] && kill -0 "$shard_runner_pid" 2>/dev/null; then
              kill -TERM "$shard_runner_pid" 2>/dev/null || true
              for _ in {1..100}; do
                if ! kill -0 "$shard_runner_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.1
              done
              if kill -0 "$shard_runner_pid" 2>/dev/null; then
                kill -KILL "$shard_runner_pid" 2>/dev/null || true
              fi
              wait "$shard_runner_pid" || true
            fi
          }
          trap terminate_shard_runner EXIT INT TERM HUP
          /usr/sbin/taskpolicy -c utility .venv/bin/python scripts/verification/run_ci_lane.py \
            --lane ci-pytest-shards \
            --sha "$UAA_CI_EXACT_SHA" \
            --temp-root "$RUNNER_TEMP" \
            --summary-file "$GITHUB_STEP_SUMMARY" &
          shard_runner_pid=$!
          set +e
          wait "$shard_runner_pid"
          shard_status=$?
          set -e
          shard_runner_pid=""
          trap - EXIT INT TERM HUP
          exit "$shard_status"

  pytest:
    name: pytest
    needs:
      - pytest-shards
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]

    steps:
      - name: Confirm complete pytest sharded suite
        env:
          PYTEST_SHARDS_RESULT: ${{ needs.pytest-shards.result }}
        run: |
          if [ "$PYTEST_SHARDS_RESULT" != "success" ]; then
            echo "Pytest sharded suite did not complete successfully."
            exit 1
          fi
          echo "All eight bounded pytest shards passed in the installed suite job."

  static-verification:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]
    needs:
