name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run master verification
        run: .venv/bin/python scripts/verify_all.py

      - name: Run Foundation Gate
        run: .venv/bin/python scripts/run_foundation_gate.py

      - name: Verify OpenAPI contract
        run: .venv/bin/python scripts/verify_openapi_contract.py

      - name: Run Ruff
        run: .venv/bin/python -m ruff check .

  control-center-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/control-center

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck --if-present

      - name: Lint frontend
        run: npm run lint --if-present

      - name: Test frontend
        run: npm run test --if-present -- --run

      - name: Build frontend
        run: npm run build --if-present
