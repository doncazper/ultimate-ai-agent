name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: uaa-ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  PATH: /opt/homebrew/opt/python@3.12/libexec/bin:/opt/homebrew/opt/node@22/bin:/opt/homebrew/bin:/usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin
  UAA_CI_EXACT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
  UAA_CI_COMPARISON_BASE_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || (github.event.before != '0000000000000000000000000000000000000000' && github.event.before || github.sha) }}

defaults:
  run:
    shell: /usr/sbin/taskpolicy -c utility /bin/bash --noprofile --norc -e -o pipefail {0}

# Self-hosted jobs are limited to branches in this private repository. Fork pull
# requests must never schedule code on the local Mac.

jobs:
  manifest-attestation:
    name: manifest-attestation
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]
    outputs:
      verification-envelope: ${{ steps.canonical.outputs.verification_envelope }}
      visual-scope: ${{ steps.visual-scope.outputs.visual_scope }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.UAA_CI_EXACT_SHA }}

      - name: Install package
        run: |
          python3.12 -m venv .ci-bootstrap
          .ci-bootstrap/bin/python -m pip install --disable-pip-version-check "uv==0.11.21"
          .ci-bootstrap/bin/uv sync --frozen --extra dev --python python3.12

      - name: Resolve canonical visual scope
        id: visual-scope
        run: |
          .venv/bin/python scripts/verification/resolve_ci_visual_scope.py \
            --repo . \
            --sha "$UAA_CI_EXACT_SHA" \
            --base-sha "$UAA_CI_COMPARISON_BASE_SHA" \
            --github-output-file "$GITHUB_OUTPUT"

      - name: Run canonical manifest attestation
        id: canonical
        run: |
          .venv/bin/python scripts/verification/run_ci_lane.py \
            --lane ci-manifest-attestation \
            --sha "$UAA_CI_EXACT_SHA" \
            --base-sha "$UAA_CI_COMPARISON_BASE_SHA" \
            --visual-scope "${{ steps.visual-scope.outputs.visual_scope }}" \
            --temp-root "$RUNNER_TEMP" \
            --github-output-file "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  lint:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]
    needs:
      - manifest-attestation
    outputs:
      verification-envelope: ${{ steps.canonical.outputs.verification_envelope }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.UAA_CI_EXACT_SHA }}

      - name: Install package
        run: |
          python3.12 -m venv .ci-bootstrap
          .ci-bootstrap/bin/python -m pip install --disable-pip-version-check "uv==0.11.21"
          .ci-bootstrap/bin/uv sync --frozen --extra dev --python python3.12

      - name: Run canonical lint lane
        id: canonical
        run: |
          .venv/bin/python scripts/verification/run_ci_lane.py \
            --lane ci-lint \
            --sha "$UAA_CI_EXACT_SHA" \
            --base-sha "$UAA_CI_COMPARISON_BASE_SHA" \
            --visual-scope "${{ needs.manifest-attestation.outputs.visual-scope }}" \
            --temp-root "$RUNNER_TEMP" \
            --github-output-file "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  affected-preflight:
    name: affected-preflight
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]
    needs:
      - manifest-attestation
    outputs:
      verification-envelope: ${{ steps.canonical.outputs.verification_envelope }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.UAA_CI_EXACT_SHA }}

      - name: Bind exact comparison base
        run: |
          if ! [[ "$UAA_CI_COMPARISON_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]; then
            echo "Comparison base is not an exact SHA."
            exit 1
          fi
          git cat-file -e "${UAA_CI_COMPARISON_BASE_SHA}^{commit}"
          git update-ref refs/uaa-ci/base-main "$UAA_CI_COMPARISON_BASE_SHA"

      - name: Install package
        run: |
          python3.12 -m venv .ci-bootstrap
          .ci-bootstrap/bin/python -m pip install --disable-pip-version-check "uv==0.11.21"
          .ci-bootstrap/bin/uv sync --frozen --extra dev --python python3.12

      - name: Run canonical fast affected preflight
        id: canonical
        run: |
          .venv/bin/python scripts/verification/run_ci_lane.py \
            --lane ci-affected-preflight \
            --sha "$UAA_CI_EXACT_SHA" \
            --base-sha "$UAA_CI_COMPARISON_BASE_SHA" \
            --visual-scope "${{ needs.manifest-attestation.outputs.visual-scope }}" \
            --temp-root "$RUNNER_TEMP" \
            --github-output-file "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  pytest-shards:
    name: pytest / sharded suite
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 60
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]
    needs:
      - manifest-attestation
      - lint
      - affected-preflight
      - release-lane-docs
      - release-lane-openapi
      - release-lane-api-safety
      - release-lane-security-redaction
      - release-lane-product-truth
      - release-lane-local-model-e2e
      - release-lane-durability
    outputs:
      verification-envelope: ${{ steps.canonical.outputs.verification_envelope }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.UAA_CI_EXACT_SHA }}

      - name: Install package
        run: |
          python3.12 -m venv .ci-bootstrap
          .ci-bootstrap/bin/python -m pip install --disable-pip-version-check "uv==0.11.21"
          .ci-bootstrap/bin/uv sync --frozen --extra dev --python python3.12
          npm --prefix integrations/matrix-client-adapter ci --ignore-scripts

      - name: Run pytest shard
        id: canonical
        run: |
          shard_runner_pid=""
          # shellcheck disable=SC2329
          terminate_shard_runner() {
            trap - EXIT
            trap '' INT TERM HUP
            if [ -n "$shard_runner_pid" ] && kill -0 "$shard_runner_pid" 2>/dev/null; then
              kill -TERM "$shard_runner_pid" 2>/dev/null || true
              for _ in {1..100}; do
                if ! kill -0 "$shard_runner_pid" 2>/dev/null; then
                  break
                fi
                sleep 0.1
              done
              if kill -0 "$shard_runner_pid" 2>/dev/null; then
                kill -KILL "$shard_runner_pid" 2>/dev/null || true
              fi
              wait "$shard_runner_pid" || true
            fi
          }
          trap terminate_shard_runner EXIT INT TERM HUP
          /usr/sbin/taskpolicy -c utility .venv/bin/python scripts/verification/run_ci_lane.py \
            --lane ci-pytest-shards \
            --sha "$UAA_CI_EXACT_SHA" \
            --base-sha "$UAA_CI_COMPARISON_BASE_SHA" \
            --visual-scope "${{ needs.manifest-attestation.outputs.visual-scope }}" \
            --temp-root "$RUNNER_TEMP" \
            --verification-execution-fence-root /private/tmp/uaa-verification-execution-fence-v2 \
            --github-output-file "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY" &
          shard_runner_pid=$!
          set +e
          wait "$shard_runner_pid"
          shard_status=$?
          set -e
          shard_runner_pid=""
          trap - EXIT INT TERM HUP
          exit "$shard_status"

  pytest:
    name: pytest
    needs:
      - manifest-attestation
      - lint
      - affected-preflight
      - release-lane-docs
      - release-lane-openapi
      - release-lane-api-safety
      - release-lane-security-redaction
      - release-lane-product-truth
      - release-lane-local-model-e2e
      - release-lane-durability
      - pytest-shards
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]
    outputs:
      verification-envelope: ${{ steps.canonical.outputs.verification_envelope }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.UAA_CI_EXACT_SHA }}

      - name: Confirm and aggregate complete pytest sharded suite
        id: canonical
        env:
          MANIFEST_ENVELOPE: ${{ needs.manifest-attestation.outputs.verification-envelope }}
          LINT_ENVELOPE: ${{ needs.lint.outputs.verification-envelope }}
          AFFECTED_ENVELOPE: ${{ needs.affected-preflight.outputs.verification-envelope }}
          DOCS_ENVELOPE: ${{ needs.release-lane-docs.outputs.verification-envelope }}
          OPENAPI_ENVELOPE: ${{ needs.release-lane-openapi.outputs.verification-envelope }}
          API_SAFETY_ENVELOPE: ${{ needs.release-lane-api-safety.outputs.verification-envelope }}
          SECURITY_REDACTION_ENVELOPE: ${{ needs.release-lane-security-redaction.outputs.verification-envelope }}
          PRODUCT_TRUTH_ENVELOPE: ${{ needs.release-lane-product-truth.outputs.verification-envelope }}
          LOCAL_MODEL_ENVELOPE: ${{ needs.release-lane-local-model-e2e.outputs.verification-envelope }}
          DURABILITY_ENVELOPE: ${{ needs.release-lane-durability.outputs.verification-envelope }}
          PYTEST_SHARDS_ENVELOPE: ${{ needs.pytest-shards.outputs.verification-envelope }}
          MANIFEST_RESULT: ${{ needs.manifest-attestation.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          AFFECTED_RESULT: ${{ needs.affected-preflight.result }}
          DOCS_RESULT: ${{ needs.release-lane-docs.result }}
          OPENAPI_RESULT: ${{ needs.release-lane-openapi.result }}
          API_SAFETY_RESULT: ${{ needs.release-lane-api-safety.result }}
          SECURITY_REDACTION_RESULT: ${{ needs.release-lane-security-redaction.result }}
          PRODUCT_TRUTH_RESULT: ${{ needs.release-lane-product-truth.result }}
          LOCAL_MODEL_RESULT: ${{ needs.release-lane-local-model-e2e.result }}
          DURABILITY_RESULT: ${{ needs.release-lane-durability.result }}
          PYTEST_SHARDS_RESULT: ${{ needs.pytest-shards.result }}
        run: |
          if [ "$MANIFEST_RESULT" != "success" ] || \
            [ "$LINT_RESULT" != "success" ] || \
            [ "$AFFECTED_RESULT" != "success" ] || \
            [ "$DOCS_RESULT" != "success" ] || \
            [ "$OPENAPI_RESULT" != "success" ] || \
            [ "$API_SAFETY_RESULT" != "success" ] || \
            [ "$SECURITY_REDACTION_RESULT" != "success" ] || \
            [ "$PRODUCT_TRUTH_RESULT" != "success" ] || \
            [ "$LOCAL_MODEL_RESULT" != "success" ] || \
            [ "$DURABILITY_RESULT" != "success" ] || \
            [ "$PYTEST_SHARDS_RESULT" != "success" ]; then
            echo "Pytest sharded suite did not complete successfully."
            exit 1
          fi
          python3.12 scripts/verification/verification_github_prerequisites.py \
            aggregate \
            --repo . \
            --sha "$UAA_CI_EXACT_SHA" \
            --base-sha "$UAA_CI_COMPARISON_BASE_SHA" \
            --visual-scope "${{ needs.manifest-attestation.outputs.visual-scope }}" \
            --envelope "$MANIFEST_ENVELOPE" \
            --envelope "$LINT_ENVELOPE" \
            --envelope "$AFFECTED_ENVELOPE" \
            --envelope "$DOCS_ENVELOPE" \
            --envelope "$OPENAPI_ENVELOPE" \
            --envelope "$API_SAFETY_ENVELOPE" \
            --envelope "$SECURITY_REDACTION_ENVELOPE" \
            --envelope "$PRODUCT_TRUTH_ENVELOPE" \
            --envelope "$LOCAL_MODEL_ENVELOPE" \
            --envelope "$DURABILITY_ENVELOPE" \
            --envelope "$PYTEST_SHARDS_ENVELOPE" \
            --github-output-file "$GITHUB_OUTPUT"

  static-verification:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]
