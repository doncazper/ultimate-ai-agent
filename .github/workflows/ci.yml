          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.UAA_CI_EXACT_SHA }}

      - name: Install package
        run: |
          python3.12 -m venv .ci-bootstrap
          .ci-bootstrap/bin/python -m pip install --disable-pip-version-check "uv==0.11.21"
          .ci-bootstrap/bin/uv sync --frozen --extra dev --python python3.12

      - name: Run frontend release lane
        id: canonical
        env:
          CONTROL_CENTER_FRONTEND_ENVELOPE: ${{ needs.control-center-frontend.outputs.verification-envelope }}
        run: |
          .venv/bin/python scripts/verification/run_ci_lane.py \
            --lane frontend \
            --sha "$UAA_CI_EXACT_SHA" \
            --base-sha "$UAA_CI_COMPARISON_BASE_SHA" \
            --visual-scope "${{ needs.manifest-attestation.outputs.visual-scope }}" \
            --temp-root "$RUNNER_TEMP" \
            --dependency-envelope "$CONTROL_CENTER_FRONTEND_ENVELOPE" \
            --github-output-file "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  release-lane-performance:
    name: Release Lane / Performance
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]
    needs:
      - manifest-attestation
      - static-verification
      - release-lane-frontend
      - release-lane-visual-regression
      - release-lane-desktop-packaging
    outputs:
      verification-envelope: ${{ steps.canonical.outputs.verification_envelope }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.UAA_CI_EXACT_SHA }}

      - name: Install package
        run: |
          python3.12 -m venv .ci-bootstrap
          .ci-bootstrap/bin/python -m pip install --disable-pip-version-check "uv==0.11.21"
          .ci-bootstrap/bin/uv sync --frozen --extra dev --python python3.12

      - name: Run performance release lane
        id: canonical
        run: |
          .venv/bin/python scripts/verification/run_ci_lane.py \
            --lane performance \
            --sha "$UAA_CI_EXACT_SHA" \
            --base-sha "$UAA_CI_COMPARISON_BASE_SHA" \
            --visual-scope "${{ needs.manifest-attestation.outputs.visual-scope }}" \
            --temp-root "$RUNNER_TEMP" \
            --github-output-file "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  release-lane-visual-regression:
    name: Release Lane / Control Center Visual Regression
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]
    needs:
      - manifest-attestation
      - control-center-frontend
    outputs:
      verification-envelope: ${{ steps.canonical.outputs.verification_envelope }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.UAA_CI_EXACT_SHA }}

      - name: Install package
        run: |
          python3.12 -m venv .ci-bootstrap
          .ci-bootstrap/bin/python -m pip install --disable-pip-version-check "uv==0.11.21"
          .ci-bootstrap/bin/uv sync --frozen --extra dev --python python3.12

      - name: Install Control Center dependencies
        if: needs.manifest-attestation.outputs.visual-scope == 'affected'
        working-directory: apps/control-center
        run: npm ci

      - name: Install Playwright Chromium
        if: needs.manifest-attestation.outputs.visual-scope == 'affected'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        working-directory: apps/control-center
        run: npx playwright install chromium

      - name: Run visual regression release lane
        id: canonical
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          github_output_args=()
          if [ "${{ needs.manifest-attestation.outputs.visual-scope }}" = "affected" ]; then
            github_output_args=(--github-output-file "$GITHUB_OUTPUT")
          fi
          .venv/bin/python scripts/verification/run_ci_lane.py \
            --lane visual-regression \
            --sha "$UAA_CI_EXACT_SHA" \
            --base-sha "$UAA_CI_COMPARISON_BASE_SHA" \
            --visual-scope "${{ needs.manifest-attestation.outputs.visual-scope }}" \
            --temp-root "$RUNNER_TEMP" \
            "${github_output_args[@]}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  release-lane-desktop-packaging:
    name: Release Lane / Desktop and Local Packaging Proof
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]
    needs:
      - manifest-attestation
      - static-verification
    outputs:
      verification-envelope: ${{ steps.canonical.outputs.verification_envelope }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.UAA_CI_EXACT_SHA }}

      - name: Install package
        run: |
          python3.12 -m venv .ci-bootstrap
          .ci-bootstrap/bin/python -m pip install --disable-pip-version-check "uv==0.11.21"
          .ci-bootstrap/bin/uv sync --frozen --extra dev --python python3.12

      - name: Check local Docker prerequisite
        id: docker
        run: |
          if command -v docker >/dev/null 2>&1 && docker info >/dev/null 2>&1; then
            echo "available=true" >> "$GITHUB_OUTPUT"
          else
            echo "available=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Control Center dependencies
        if: steps.docker.outputs.available == 'true'
        working-directory: apps/control-center
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.docker.outputs.available == 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        working-directory: apps/control-center
        run: npx playwright install --with-deps chromium

      - name: Run desktop packaging release lane
        id: canonical
        env:
          DOCKER_AVAILABLE: ${{ steps.docker.outputs.available }}
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        run: |
          docker_posture="unavailable"
          github_output_args=()
          if [ "$DOCKER_AVAILABLE" = "true" ]; then
            docker_posture="available"
            github_output_args=(--github-output-file "$GITHUB_OUTPUT")
          fi
          .venv/bin/python scripts/verification/run_ci_lane.py \
            --lane desktop-packaging \
            --sha "$UAA_CI_EXACT_SHA" \
            --base-sha "$UAA_CI_COMPARISON_BASE_SHA" \
            --visual-scope "${{ needs.manifest-attestation.outputs.visual-scope }}" \
            --temp-root "$RUNNER_TEMP" \
            --docker-available "$docker_posture" \
            "${github_output_args[@]}" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  foundation-gate-report:
    if: always() && (github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]
    needs:
      - manifest-attestation
      - lint
      - affected-preflight
      - release-lane-docs
      - release-lane-openapi
      - release-lane-api-safety
      - release-lane-security-redaction
      - release-lane-product-truth
      - release-lane-local-model-e2e
      - release-lane-durability
      - pytest-shards
      - pytest
      - static-verification
      - control-center-frontend
      - release-lane-desktop-packaging
      - release-lane-frontend
      - release-lane-visual-regression
      - release-lane-performance
    outputs:
      verification-envelope: ${{ steps.canonical.outputs.verification_envelope }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.UAA_CI_EXACT_SHA }}

      - name: Install package
        run: |
          python3.12 -m venv .ci-bootstrap
          .ci-bootstrap/bin/python -m pip install --disable-pip-version-check "uv==0.11.21"
          .ci-bootstrap/bin/uv sync --frozen --extra dev --python python3.12

      - name: Validate complete exact-head evidence DAG
        env:
          MANIFEST_ENVELOPE: ${{ needs.manifest-attestation.outputs.verification-envelope }}
          LINT_ENVELOPE: ${{ needs.lint.outputs.verification-envelope }}
          AFFECTED_ENVELOPE: ${{ needs.affected-preflight.outputs.verification-envelope }}
          DOCS_ENVELOPE: ${{ needs.release-lane-docs.outputs.verification-envelope }}
          OPENAPI_ENVELOPE: ${{ needs.release-lane-openapi.outputs.verification-envelope }}
          API_SAFETY_ENVELOPE: ${{ needs.release-lane-api-safety.outputs.verification-envelope }}
          SECURITY_REDACTION_ENVELOPE: ${{ needs.release-lane-security-redaction.outputs.verification-envelope }}
          PRODUCT_TRUTH_ENVELOPE: ${{ needs.release-lane-product-truth.outputs.verification-envelope }}
          LOCAL_MODEL_ENVELOPE: ${{ needs.release-lane-local-model-e2e.outputs.verification-envelope }}
          DURABILITY_ENVELOPE: ${{ needs.release-lane-durability.outputs.verification-envelope }}
          PYTEST_SHARDS_ENVELOPE: ${{ needs.pytest-shards.outputs.verification-envelope }}
          PYTEST_ENVELOPE: ${{ needs.pytest.outputs.verification-envelope }}
          STATIC_ENVELOPE: ${{ needs.static-verification.outputs.verification-envelope }}
          CONTROL_CENTER_ENVELOPE: ${{ needs.control-center-frontend.outputs.verification-envelope }}
          DESKTOP_ENVELOPE: ${{ needs.release-lane-desktop-packaging.outputs.verification-envelope }}
          FRONTEND_ENVELOPE: ${{ needs.release-lane-frontend.outputs.verification-envelope }}
          VISUAL_ENVELOPE: ${{ needs.release-lane-visual-regression.outputs.verification-envelope }}
          PERFORMANCE_ENVELOPE: ${{ needs.release-lane-performance.outputs.verification-envelope }}
          MANIFEST_RESULT: ${{ needs.manifest-attestation.result }}
          LINT_RESULT: ${{ needs.lint.result }}
          AFFECTED_RESULT: ${{ needs.affected-preflight.result }}
          DOCS_RESULT: ${{ needs.release-lane-docs.result }}
          OPENAPI_RESULT: ${{ needs.release-lane-openapi.result }}
          API_SAFETY_RESULT: ${{ needs.release-lane-api-safety.result }}
          SECURITY_REDACTION_RESULT: ${{ needs.release-lane-security-redaction.result }}
          PRODUCT_TRUTH_RESULT: ${{ needs.release-lane-product-truth.result }}
          LOCAL_MODEL_RESULT: ${{ needs.release-lane-local-model-e2e.result }}
          DURABILITY_RESULT: ${{ needs.release-lane-durability.result }}
          PYTEST_SHARDS_RESULT: ${{ needs.pytest-shards.result }}
          PYTEST_RESULT: ${{ needs.pytest.result }}
          STATIC_RESULT: ${{ needs.static-verification.result }}
          CONTROL_CENTER_RESULT: ${{ needs.control-center-frontend.result }}
          DESKTOP_RESULT: ${{ needs.release-lane-desktop-packaging.result }}
          FRONTEND_RESULT: ${{ needs.release-lane-frontend.result }}
          VISUAL_RESULT: ${{ needs.release-lane-visual-regression.result }}
          PERFORMANCE_RESULT: ${{ needs.release-lane-performance.result }}
        run: |
          .venv/bin/python scripts/verification/verify_ci_evidence_dag.py \
            --repo . \
            --sha "$UAA_CI_EXACT_SHA" \
            --base-sha "$UAA_CI_COMPARISON_BASE_SHA" \
            --visual-scope "${{ needs.manifest-attestation.outputs.visual-scope }}" \
            --result "manifest-attestation=$MANIFEST_RESULT" \
            --result "lint=$LINT_RESULT" \
            --result "affected-preflight=$AFFECTED_RESULT" \
            --result "release-lane-docs=$DOCS_RESULT" \
            --result "release-lane-openapi=$OPENAPI_RESULT" \
            --result "release-lane-api-safety=$API_SAFETY_RESULT" \
            --result "release-lane-security-redaction=$SECURITY_REDACTION_RESULT" \
            --result "release-lane-product-truth=$PRODUCT_TRUTH_RESULT" \
            --result "release-lane-local-model-e2e=$LOCAL_MODEL_RESULT" \
            --result "release-lane-durability=$DURABILITY_RESULT" \
            --result "pytest-shards=$PYTEST_SHARDS_RESULT" \
            --result "pytest=$PYTEST_RESULT" \
            --result "static-verification=$STATIC_RESULT" \
            --result "control-center-frontend=$CONTROL_CENTER_RESULT" \
            --result "release-lane-desktop-packaging=$DESKTOP_RESULT" \
            --result "release-lane-frontend=$FRONTEND_RESULT" \
            --result "release-lane-visual-regression=$VISUAL_RESULT" \
            --result "release-lane-performance=$PERFORMANCE_RESULT" \
            --envelope "manifest-attestation=$MANIFEST_ENVELOPE" \
            --envelope "lint=$LINT_ENVELOPE" \
            --envelope "affected-preflight=$AFFECTED_ENVELOPE" \
            --envelope "release-lane-docs=$DOCS_ENVELOPE" \
            --envelope "release-lane-openapi=$OPENAPI_ENVELOPE" \
            --envelope "release-lane-api-safety=$API_SAFETY_ENVELOPE" \
            --envelope "release-lane-security-redaction=$SECURITY_REDACTION_ENVELOPE" \
            --envelope "release-lane-product-truth=$PRODUCT_TRUTH_ENVELOPE" \
            --envelope "release-lane-local-model-e2e=$LOCAL_MODEL_ENVELOPE" \
            --envelope "release-lane-durability=$DURABILITY_ENVELOPE" \
            --envelope "pytest-shards=$PYTEST_SHARDS_ENVELOPE" \
            --envelope "pytest=$PYTEST_ENVELOPE" \
            --envelope "static-verification=$STATIC_ENVELOPE" \
            --envelope "control-center-frontend=$CONTROL_CENTER_ENVELOPE" \
            --envelope "release-lane-frontend=$FRONTEND_ENVELOPE" \
            --envelope "release-lane-performance=$PERFORMANCE_ENVELOPE" \
            --optional-envelope "release-lane-desktop-packaging=$DESKTOP_ENVELOPE" \
            --optional-envelope "release-lane-visual-regression=$VISUAL_ENVELOPE" \
            --output "$RUNNER_TEMP/uaa_ci_evidence_dag_gate.json"

      - name: Revalidate exact prerequisite receipts
        env:
          MANIFEST_ENVELOPE: ${{ needs.manifest-attestation.outputs.verification-envelope }}
          LINT_ENVELOPE: ${{ needs.lint.outputs.verification-envelope }}
          AFFECTED_ENVELOPE: ${{ needs.affected-preflight.outputs.verification-envelope }}
          DOCS_ENVELOPE: ${{ needs.release-lane-docs.outputs.verification-envelope }}
          OPENAPI_ENVELOPE: ${{ needs.release-lane-openapi.outputs.verification-envelope }}
          API_SAFETY_ENVELOPE: ${{ needs.release-lane-api-safety.outputs.verification-envelope }}
          SECURITY_REDACTION_ENVELOPE: ${{ needs.release-lane-security-redaction.outputs.verification-envelope }}
          PRODUCT_TRUTH_ENVELOPE: ${{ needs.release-lane-product-truth.outputs.verification-envelope }}
          LOCAL_MODEL_ENVELOPE: ${{ needs.release-lane-local-model-e2e.outputs.verification-envelope }}
          DURABILITY_ENVELOPE: ${{ needs.release-lane-durability.outputs.verification-envelope }}
          PYTEST_SHARDS_ENVELOPE: ${{ needs.pytest-shards.outputs.verification-envelope }}
          STATIC_ENVELOPE: ${{ needs.static-verification.outputs.verification-envelope }}
        run: |
          .venv/bin/python scripts/verification/verification_github_prerequisites.py \
            foundation-manifest \
            --repo . \
            --sha "$UAA_CI_EXACT_SHA" \
            --base-sha "$UAA_CI_COMPARISON_BASE_SHA" \
            --visual-scope "${{ needs.manifest-attestation.outputs.visual-scope }}" \
            --envelope "$MANIFEST_ENVELOPE" \
            --envelope "$LINT_ENVELOPE" \
            --envelope "$AFFECTED_ENVELOPE" \
            --envelope "$DOCS_ENVELOPE" \
            --envelope "$OPENAPI_ENVELOPE" \
            --envelope "$API_SAFETY_ENVELOPE" \
            --envelope "$SECURITY_REDACTION_ENVELOPE" \
            --envelope "$PRODUCT_TRUTH_ENVELOPE" \
            --envelope "$LOCAL_MODEL_ENVELOPE" \
            --envelope "$DURABILITY_ENVELOPE" \
            --envelope "$PYTEST_SHARDS_ENVELOPE" \
            --envelope "$STATIC_ENVELOPE" \
            --output "$RUNNER_TEMP/uaa_foundation_prerequisite_manifest.json"

      - name: Run Foundation Gate report
        id: canonical
        run: |
          .venv/bin/python scripts/verification/run_ci_lane.py \
            --lane ci-foundation-report \
            --sha "$UAA_CI_EXACT_SHA" \
            --base-sha "$UAA_CI_COMPARISON_BASE_SHA" \
            --visual-scope "${{ needs.manifest-attestation.outputs.visual-scope }}" \
            --temp-root "$RUNNER_TEMP" \
            --github-output-file "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  control-center-frontend:
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]
    needs:
      - manifest-attestation
      - pytest
    outputs:
      verification-envelope: ${{ steps.canonical.outputs.verification_envelope }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ env.UAA_CI_EXACT_SHA }}

      - name: Install frontend dependencies
        working-directory: apps/control-center
        run: npm ci

      - name: Install package
        run: |
          python3.12 -m venv .ci-bootstrap
          .ci-bootstrap/bin/python -m pip install --disable-pip-version-check "uv==0.11.21"
          .ci-bootstrap/bin/uv sync --frozen --extra dev --python python3.12

      - name: Run canonical Control Center frontend lane
        id: canonical
        run: |
          .venv/bin/python scripts/verification/run_ci_lane.py \
            --lane ci-control-center-frontend \
            --sha "$UAA_CI_EXACT_SHA" \
            --base-sha "$UAA_CI_COMPARISON_BASE_SHA" \
            --visual-scope "${{ needs.manifest-attestation.outputs.visual-scope }}" \
            --temp-root "$RUNNER_TEMP" \
            --verification-execution-fence-root /private/tmp/uaa-verification-execution-fence-v2 \
            --github-output-file "$GITHUB_OUTPUT" \
            --summary-file "$GITHUB_STEP_SUMMARY"
