          .venv/bin/python -m pip install -e ".[dev]"

      - name: Run Foundation Gate report
        run: .venv/bin/python scripts/run_foundation_gate.py --command-mode ci-parallel --no-write-latest

  control-center-frontend:
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: apps/control-center

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: apps/control-center/package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: Typecheck frontend
        run: npm run typecheck --if-present

      - name: Lint frontend
        run: npm run lint --if-present

      - name: Test frontend
        run: npm run test --if-present -- --run

      - name: Build frontend
        run: npm run build --if-present
