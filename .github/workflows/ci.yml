  release-lane-visual-regression:
    name: Release Lane / Control Center Visual Regression
    if: github.event_name == 'push' || github.event.pull_request.head.repo.full_name == github.repository
    timeout-minutes: 45
    runs-on: [self-hosted, macOS, ARM64, uaa-ci]
    needs:
      - control-center-frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: ${{ env.UAA_CI_EXACT_SHA }}

      - name: Install package
        run: |
          python3.12 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -e ".[dev]"

      - name: Determine visual regression scope
        id: visual-scope
        env:
          PULL_REQUEST_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PUSH_BEFORE_SHA: ${{ github.event.before }}
          RANGE_HEAD_SHA: ${{ env.UAA_CI_EXACT_SHA }}
        run: |
          run_visual=true
          reason_ref="reason-ref:visual-regression:fail-closed"
          range_base="$PUSH_BEFORE_SHA"
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            range_base="$PULL_REQUEST_BASE_SHA"
          fi
          zero_sha="0000000000000000000000000000000000000000"
          if [ -n "$range_base" ] && [ "$range_base" != "$zero_sha" ] && \
            git cat-file -e "${range_base}^{commit}" 2>/dev/null && \
            git cat-file -e "${RANGE_HEAD_SHA}^{commit}" 2>/dev/null && \
            git diff --no-renames --quiet "$range_base" "$RANGE_HEAD_SHA" -- \
              apps/control-center \
              docs/control_center \
              docs/design/control_center_north_star \
              docs/schemas/control_center_release_surface.schema.json \
              scripts/verify_beta_local.py \
              scripts/verify_beta_13_frontend_loading_visual_proof.py \
              scripts/verify_control_center_visual_regression.py \
              scripts/verify_control_center_release_surface.py \
              scripts/verify_fcc_polish_001_native_apple_grade_ux_layer.py \
              tests/test_control_center_release_surface_manifest.py \
              tests/test_control_center_visual_and_packaging_proofs.py \
              tests/test_fcc_polish_001_native_apple_grade_ux_layer.py; then
            run_visual=false
            reason_ref="reason-ref:visual-regression:not-affected"
          fi
          echo "run_visual=${run_visual}" >> "$GITHUB_OUTPUT"
          echo "reason_ref=${reason_ref}" >> "$GITHUB_OUTPUT"

      - name: Install Control Center dependencies
        if: steps.visual-scope.outputs.run_visual == 'true'
        working-directory: apps/control-center
        run: npm ci

      - name: Install Playwright Chromium
        if: steps.visual-scope.outputs.run_visual == 'true'
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
        working-directory: apps/control-center
        run: npx playwright install chromium

      - name: Run visual regression release lane
        env:
          PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/playwright-browsers
          RUN_VISUAL: ${{ steps.visual-scope.outputs.run_visual }}
        run: |
          visual_scope="not_affected"
          if [ "$RUN_VISUAL" = "true" ]; then
            visual_scope="affected"
          fi
          .venv/bin/python scripts/verification/run_ci_lane.py \
            --lane visual-regression \
            --sha "$UAA_CI_EXACT_SHA" \
            --temp-root "$RUNNER_TEMP" \
            --visual-scope "$visual_scope" \
            --summary-file "$GITHUB_STEP_SUMMARY"

  release-lane-desktop-packaging:
