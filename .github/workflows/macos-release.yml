name: macOS first-class verification

on:
  push:
    tags:
      - "v0.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing immutable tag to verify
        required: true
        type: string
      channel:
        description: Release channel (must match tag policy)
        required: true
        default: auto
        type: choice
        options:
          - auto
          - stable
          - dev
      publish_release:
        description: Blocked until an isolated credential-provisioned publisher exists
        required: true
        default: false
        type: boolean
      publish_installer_bootstrap:
        description: Blocked until an isolated credential-provisioned publisher exists
        required: true
        default: false
        type: boolean

permissions: {}

concurrency:
  group: uaa-macos-release-${{ github.ref }}
  cancel-in-progress: false

env:
  PATH: /usr/local/bin:/usr/bin:/bin:/usr/sbin:/sbin

defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}

jobs:
  verify-source:
    if: github.repository == 'doncazper/ultimate-ai-agent'
    timeout-minutes: 90
    runs-on: macos-15
    permissions:
      contents: read

    steps:
      - name: Reject unsupported hosted publication
        if: >-
          github.event_name == 'workflow_dispatch' &&
          (inputs.publish_release == true ||
          inputs.publish_installer_bootstrap == true)
        run: |
          echo "Hosted release publication is blocked until an isolated credential-provisioned publisher is implemented and verified." >&2
          exit 1

      - name: Resolve immutable source tag
        id: source
        env:
          EVENT_NAME: ${{ github.event_name }}
          PUSH_TAG: ${{ github.ref_name }}
          REQUESTED_TAG: ${{ inputs.release_tag }}
          REQUESTED_CHANNEL: ${{ inputs.channel }}
        run: |
          tag="$PUSH_TAG"
          channel="auto"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$REQUESTED_TAG"
            channel="$REQUESTED_CHANNEL"
          fi
          if ! [[ "$tag" =~ ^[A-Za-z0-9][A-Za-z0-9._+-]{0,127}$ ]]; then
            echo "Unsafe release tag." >&2
            exit 1
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "requested_channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Check out trusted workflow toolchain
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ github.workflow_sha }}

      - name: Set up immutable toolchain
        uses: ./.github/actions/setup-toolchain

      - name: Check out exact tag
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          clean: true
          fetch-depth: 0
          persist-credentials: false
          ref: refs/tags/${{ steps.source.outputs.tag }}

      - name: Bind channel and exact source identity
        id: identity
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          REQUESTED_CHANNEL: ${{ steps.source.outputs.requested_channel }}
        run: |
          tag_commit="$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")"
          head_commit="$(git rev-parse HEAD)"
          if [ "$tag_commit" != "$head_commit" ]; then
            echo "Checked-out SHA does not match immutable tag." >&2
            exit 1
          fi
          channel="$(PYTHONPATH=src python3.12 scripts/macos/release_policy.py \
            --tag "$RELEASE_TAG" --channel "$REQUESTED_CHANNEL")"
          source_timestamp="$(git log -1 --format=%cI "$head_commit")"
          echo "commit=$head_commit" >> "$GITHUB_OUTPUT"
          echo "source_timestamp=$source_timestamp" >> "$GITHUB_OUTPUT"
          echo "channel=$channel" >> "$GITHUB_OUTPUT"

      - name: Verify focused installer contracts
        run: |
          python3.12 -m venv .macos-build-venv
          .macos-build-venv/bin/python -m pip install --disable-pip-version-check "uv==0.11.21"
          .macos-build-venv/bin/uv sync --frozen --extra dev --python python3.12
          PYTHONPATH=src .venv/bin/python -m pytest \
            tests/test_macos_first_class_installer.py

      - name: Build production Control Center
        working-directory: apps/control-center
        run: |
          npm ci
          npm run build

      - name: Fetch pinned relocatable Python
        id: python
        run: |
          runtime_path="$(scripts/macos/prepare_python_runtime.sh arm64 \
            "$RUNNER_TEMP/uaa-python-runtime")"
          echo "runtime_path=$runtime_path" >> "$GITHUB_OUTPUT"

      - name: Build and verify release assets
        env:
          RELEASE_TAG: ${{ steps.source.outputs.tag }}
          RELEASE_CHANNEL: ${{ steps.identity.outputs.channel }}
          SOURCE_COMMIT: ${{ steps.identity.outputs.commit }}
          SOURCE_TIMESTAMP: ${{ steps.identity.outputs.source_timestamp }}
          PYTHON_RUNTIME: ${{ steps.python.outputs.runtime_path }}
        run: |
          PATH="$GITHUB_WORKSPACE/.macos-build-venv/bin:$PATH" \
            PYTHONPATH=src .venv/bin/python scripts/macos/build_release_bundle.py \
              --python-runtime "$PYTHON_RUNTIME" \
              --output-dir "$RUNNER_TEMP/uaa-macos-release" \
              --tag "$RELEASE_TAG" \
              --channel "$RELEASE_CHANNEL" \
              --source-commit "$SOURCE_COMMIT" \
              --source-timestamp "$SOURCE_TIMESTAMP" \
              --architecture arm64
          PYTHONPATH=src .venv/bin/python scripts/macos/verify_installer_e2e.py \
            --archive "$RUNNER_TEMP/uaa-macos-release/uaa-macos-arm64.tar.gz" \
            --descriptor "$RUNNER_TEMP/uaa-macos-release/uaa-macos-arm64.release.json"
