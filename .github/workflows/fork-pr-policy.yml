name: Fork PR Policy

on:
  pull_request_target:
    types:
      - opened
      - reopened
      - synchronize

permissions: {}

env:
  PATH: /usr/bin:/bin:/usr/sbin:/sbin

defaults:
  run:
    shell: /bin/bash --noprofile --norc -e -o pipefail {0}

jobs:
  fork-policy:
    name: fork-policy
    runs-on: ubuntu-24.04
    env:
      BASE_REPOSITORY: ${{ github.repository }}
      PR_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
    steps:
      - name: Confirm metadata-only public fork boundary
        run: |
          if [ -z "$BASE_REPOSITORY" ] || [ -z "$PR_HEAD_REPOSITORY" ]; then
            echo "Pull request repository metadata is incomplete."
            exit 1
          fi
          if [ "$PR_HEAD_REPOSITORY" = "$BASE_REPOSITORY" ]; then
            echo "Same-repository pull request confirmed."
          else
            echo "External pull request confirmed for approved GitHub-hosted read-only CI."
          fi
