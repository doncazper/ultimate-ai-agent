[project]
name = "ultimate-ai-agent"
version = "0.104.0"
description = "Ultimate AI Agent Core"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "httpx>=0.24.0",
    "jsonschema>=4.0.0",
    "ruff>=0.5.0",
]

[build-system]
requires = ["setuptools>=61.0.0"]
build-backend = "setuptools.build_meta"

[tool.ruff]
exclude = []

[tool.ruff.lint.per-file-ignores]
# These two compatibility initializers intentionally re-export their public
# contract surfaces. New package initializers remain fully linted.
"src/ultimate_ai_agent/core/control_center/__init__.py" = ["F401"]
"src/ultimate_ai_agent/core/runtime_gateway/__init__.py" = ["F401"]
# These frozen compatibility shards share one explicit legacy namespace. The
# list is intentionally exact so newly added shards receive full lint coverage.
"src/ultimate_ai_agent/core/gate/legacy_check_families/part_001.py" = ["F401", "F405"]
