[package]
name = "uaa-matrix-rust-broker"
version = "0.104.0"
edition = "2024"
rust-version = "1.93"
license = "MIT"
publish = false

[dependencies]
base64 = "=0.22.1"
fs2 = "=0.4.3"
hex = "=0.4.3"
hmac = "=0.12.1"
matrix-sdk = { version = "=0.18.0", default-features = true }
rand = "=0.8.6"
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"
sha2 = "=0.10.9"
tokio = { version = "=1.48.0", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "time"] }
url = "=2.5.7"
zeroize = { version = "=1.8.2", features = ["zeroize_derive"] }

[target.'cfg(target_os = "macos")'.dependencies]
security-framework = { version = "=3.7.0", features = ["OSX_10_15"] }

[dev-dependencies]
tempfile = "=3.23.0"

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = true
